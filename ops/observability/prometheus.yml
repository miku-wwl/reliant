global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: reliant-otel-export
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
