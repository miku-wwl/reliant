name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify (dependencies, format, build, tests)
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Verify Phase 2 and Phase 3 experiment inventory
        shell: pwsh
        run: ./scripts/verify-experiments.ps1 -SkipBuild

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliant-test-results
          path: |
            artifacts/test-results/*.trx
            artifacts/logs/*.log
            artifacts/test-summary.md
            artifacts/experiment-summary.md
            artifacts/vulnerable-packages.txt
          if-no-files-found: error
          retention-days: 30
